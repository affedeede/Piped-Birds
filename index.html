<!DOCTYPE html>
<html>
<head>
<title>Piped Birds - Kayden</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
    * { touch-action: none; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; box-sizing:border-box; }
  body { margin:0; background:#1a1a2e; display:flex; justify-content:center; align-items:center; height:100vh; height:100dvh; font-family:Arial; overflow:hidden; overscroll-behavior:none; position:fixed; width:100%; }
  #game { position:relative; width:100vw; height:100dvh; background:linear-gradient(180deg, #4fc3f7 0%, #81d4fa 30%, #b3e5fc 55%, #e1f5fe 75%, #fff9c4 100%); overflow:hidden; }
  #loader { position:absolute; top:0; left:0; width:100%; height:100%; background:linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); z-index:100; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:15px; transition: opacity 0.5s, visibility 0.5s; }
  #loader.hidden { opacity:0; visibility:hidden; }
  #loader h1 { color:#ffeb3b; font-size:32px; font-weight:900; margin:0; text-shadow: 3px 3px 0 #111; letter-spacing:2px; text-align:center; line-height:1.1; }
  #loader .load-bird { font-size:50px; animation: bounce 0.6s ease-in-out infinite alternate; }
  @keyframes bounce { from { transform: translateY(0) rotate(-5deg); } to { transform: translateY(-15px) rotate(5deg); } }
  #loader p { color:white; font-size:13px; font-weight:700; margin:0; opacity:0.8; }
  .load-bar { width:220px; height:18px; background:#111; border:3px solid #fff; border-radius:20px; overflow:hidden; }
  .load-fill { height:100%; width:0%; background:linear-gradient(90deg, #ffeb3b, #ff9800, #ff5252); border-radius:20px; animation: fill var(--load-time, 6.5s) linear forwards; }
  @keyframes fill { 0% { width:0%; } 30% { width:35%; } 60% { width:70%; } 100% { width:100%; } }
  .load-tip { color:#81d4fa; font-size:11px; }
  .cloud { position:absolute; background:white; border-radius:50px; opacity:0.9; will-change:transform; }
  .cloud::before, .cloud::after { content:""; position:absolute; background:white; border-radius:50%; }
  .c1 { width:80px; height:24px; top:60px; left:30px; animation: drift 25s linear infinite; }
  .c1::before { width:35px; height:35px; top:-15px; left:12px; }
  .c1::after { width:25px; height:25px; top:-10px; left:40px; }
  .c2 { width:60px; height:20px; top:120px; left:250px; animation: drift 18s linear infinite; opacity:0.7; }
  .c2::before { width:28px; height:28px; top:-12px; left:10px; }
  .c2::after { width:20px; height:20px; top:-8px; left:32px; }
  @keyframes drift { from { transform:translateX(110vw); } to { transform:translateX(-120px); } }
  #ground { position:absolute; bottom:0; left:0; width:100%; height:70px; background:linear-gradient(180deg, #8d6e63 0%, #a1887f 10%, #c2a878 12%, #8bc34a 12%, #7cb342 35%, #558b2f 100%); border-top:4px solid #5d4037; z-index:3; }
  #ground::after { content:""; position:absolute; top:12px; left:0; width:100%; height:8px; background: repeating-linear-gradient(90deg, #558b2f 0 20px, #689f38 20px 40px); opacity:0.6; }
  #bird { position:absolute; width:44px; height:34px; left:80px; top:250px; z-index:10; will-change:transform, top; }
  .bird-body { position:absolute; width:44px; height:34px; background: radial-gradient(circle at 35% 30%, #fff59d 0%, #ffeb3b 35%, #ffc107 65%, #ff8f00 100%); border:2px solid #1a1a1a; border-radius: 50% 55% 45% 50% / 55% 55% 45% 45%; overflow:visible; }
  .bird-belly { position:absolute; width:28px; height:18px; background: radial-gradient(circle, #fffde7, #ffecb3); border-radius:50%; bottom:2px; left:7px; opacity:0.9; }
  .bird-wing { position:absolute; width:24px; height:16px; background: linear-gradient(180deg, #ff7043, #e64a19); border:1.5px solid #1a1a1a; border-radius: 50% 10% 50% 50%; top:12px; left:6px; transform-origin: top left; animation: flap 0.35s ease-in-out infinite alternate; z-index:2; }
  .bird-wing::after { content:""; position:absolute; width:18px; height:3px; background:#bf360c; bottom:3px; left:2px; border-radius:5px; }
  @keyframes flap { from { transform: rotate(-15deg) scaleY(1); } to { transform: rotate(25deg) scaleY(0.85); } }
  .bird-tail { position:absolute; width:22px; height:14px; background: linear-gradient(180deg, #f5f5f5 0%, #e0e0e0 15%, #bdbdbd 30%, #9e9e9e 45%, #eeeeee 50%, #9e9e9e 55%, #757575 70%, #424242 90%, #212121 100%); border:1.5px solid #111; border-radius: 2px; left:-18px; top:14px; transform: rotate(-8deg); }
  .bird-tail::after { content:""; position:absolute; width:7px; height:20px; background: linear-gradient(180deg, #ffffff 0%, #cfcfcf 25%, #9e9e9e 50%, #e0e0e0 75%, #616161 100%); border:1.5px solid #111; border-radius:2px; top:-3px; left:-6px; }
  .bird-tail::before { content:""; position:absolute; width:18px; height:3px; background:rgba(255,255,255,0.6); top:2px; left:2px; border-radius:5px; z-index:1; }
  .bird-eye { position:absolute; width:13px; height:13px; background:white; border:1.5px solid #111; border-radius:50%; top:5px; right:6px; z-index:3; }
  .bird-eye::after { content:""; position:absolute; width:6px; height:6px; background:#111; border-radius:50%; top:3px; left:4px; }
  .bird-eye::before { content:""; position:absolute; width:2px; height:2px; background:white; border-radius:50%; top:4px; left:6px; z-index:1; }
  .bird-beak { position:absolute; width:14px; height:9px; background:linear-gradient(180deg, #ff6d00, #e65100); border:1.5px solid #111; border-radius: 0 50% 50% 0; top:14px; right:-10px; z-index:3; clip-path: polygon(0 20%, 100% 50%, 0 80%); }
  .bird-cheek { position:absolute; width:15px; height:11px; background: radial-gradient(circle, #ff8a80 0%, #ff5252 60%, #e53935 100%); border-radius:50%; top:14px; right:8px; opacity:0.95; z-index:2; animation: blush 1.2s ease-in-out infinite alternate; }
  @keyframes blush { from { transform: scale(1); opacity:0.75; } to { transform: scale(1.25); opacity:1; } }
  .bird-cheek::after { content:""; position:absolute; width:8px; height:2px; background:#ff1744; border-radius:5px; top:3px; left:3px; opacity:0.5; }
  .bird-cheek::before { content:""; position:absolute; width:8px; height:2px; background:#ff1744; border-radius:5px; top:6px; left:3px; opacity:0.5; }
  .pipe { position:absolute; width:62px; background: linear-gradient(90deg, #0b3d12 0%, #145a1e 8%, #1f7a2e 18%, #2e9e3f 30%, #5fd35a 42%, #b9ff9e 50%, #eaffd0 52%, #5fd35a 60%, #2e9e3f 72%, #145a1e 88%, #0b3d12 100%); border-left:2px solid #071f0a; border-right:2px solid #071f0a; will-change:transform; }
  .pipe::before { content:""; position:absolute; top:0; left:12px; width:6px; height:100%; background:linear-gradient(180deg, rgba(255,255,255,0.45), rgba(255,255,255,0.05)); border-radius:5px; }
  .pipe::after { content:""; position:absolute; top:0; right:14px; width:3px; height:100%; background:rgba(0,0,0,0.18); }
  .pipe-cap { position:absolute; left:-5px; width:72px; height:30px; background: linear-gradient(90deg, #0b3d12 0%, #1a6a26 12%, #33a844 28%, #7fe06a 42%, #d8ffc0 50%, #7fe06a 58%, #33a844 72%, #1a6a26 88%, #0b3d12 100%); border:2.5px solid #071f0a; border-radius:4px; }
  .pipe-cap::before { content:""; position:absolute; top:6px; left:8px; width:56px; height:6px; background:rgba(255,255,255,0.35); border-radius:10px; }
  .bolt { position:absolute; width:6px; height:6px; background:radial-gradient(circle at 30% 30%, #e0e0e0, #666); border:1px solid #222; border-radius:50%; }
  .pipe-top-cap { bottom:-2px; }
  .pipe-bot-cap { top:-2px; }
  #score { position:absolute; top:14px; left:50%; transform:translateX(-50%); font-size:36px; font-weight:900; color:white; text-shadow: 3px 3px 0 #111; z-index:20; font-family: 'Arial Black', Arial; }
  #best { position:absolute; top:54px; left:50%; transform:translateX(-50%); font-size:14px; font-weight:900; color:#ffeb3b; text-shadow: 2px 2px 0 #111; z-index:20; background:rgba(0,0,0,0.35); padding:3px 12px; border-radius:20px; }
  #start { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:linear-gradient(180deg, #fff, #ffe082); padding:20px 28px; border:4px solid #111; font-weight:900; cursor:pointer; text-align:center; z-index:30; border-radius:16px; font-size:20px; line-height:1.4; max-width:90vw; }
  #start small { font-weight:600; font-size:13px; color:#555; }
</style>
</head>
<body>
<div id="game">
  <div id="loader"><div class="load-bird">🐤</div><h1>PIPED<br>BIRDS</h1><div class="load-bar"><div class="load-fill"></div></div><p>LOADING...</p><div class="load-tip">By Kayden • by affedeede</div></div>
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div id="score">0</div><div id="best">BEST: 0</div>
  <div id="bird"><div class="bird-tail"></div><div class="bird-body"><div class="bird-belly"></div><div class="bird-wing"></div><div class="bird-cheek"></div><div class="bird-eye"></div><div class="bird-beak"></div></div></div>
  <div id="ground"></div>
  <div id="start">PIPED BIRDS<br><span style="font-size:28px">🐤</span><br><small>By Kayden<br>Click / Space to Flap<br>by affedeede</small></div>
</div>
<script>
let game=document.getElementById('game'),bird=document.getElementById('bird'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),startEl=document.getElementById('start'),loader=document.getElementById('loader');
function getW(){return game.clientWidth||window.innerWidth}
function getH(){return game.clientHeight||window.innerHeight}
function birdX(){return Math.max(50,getW()*0.20)}
function groundTop(){return getH()-70}
let birdY=250,velocity=0,gravity=0.45,jump=-8,score=0,playing=false,pipes=[],lastTime=0,pipeSpawn=0,rafId=null;
let best=parseInt(localStorage.getItem('pipedBirdsBest')||'0'); bestEl.textContent='BEST: '+best;
function syncStartPos(){ if(!playing){ birdY=getH()*0.42; bird.style.top=birdY+'px'; bird.style.left=birdX()+'px'; } }
window.addEventListener('resize',syncStartPos); if(window.visualViewport) window.visualViewport.addEventListener('resize',syncStartPos); syncStartPos();
let loadTime=6000+Math.random()*1000; document.querySelector('.load-fill').style.setProperty('--load-time',(loadTime/1000)+'s');
setTimeout(()=>{loader.classList.add('hidden')},loadTime+300);
function flap(){ if(!playing) startGame(); velocity=jump; bird.style.transform='rotate(-18deg)'; setTimeout(()=>{if(playing) bird.style.transform='rotate(8deg)'},150); }
function startGame(){ playing=true; score=0; scoreEl.textContent=0; birdY=getH()*0.42; velocity=0; pipes.forEach(p=>p.el.remove()); pipes=[]; startEl.style.display='none'; pipeSpawn=0; cancelAnimationFrame(rafId); lastTime=performance.now(); rafId=requestAnimationFrame(update); createPipe(); }
function createPipe(){ let W=getW(),H=getH(); let gap=Math.max(150,H*0.27); let maxTop=Math.max(60,H-70-gap-60); let topHeight=Math.random()*maxTop+40; let mk=(isTop)=>{ let el=document.createElement('div'); el.className='pipe'; el.style.height=(isTop?topHeight:H-70-topHeight-gap)+'px'; el.style.top=(isTop?0:topHeight+gap)+'px'; el.style.left='0px'; let cap=document.createElement('div'); cap.className='pipe-cap '+(isTop?'pipe-top-cap':'pipe-bot-cap'); cap.innerHTML='<div class="bolt" style="top:8px;left:6px"></div><div class="bolt" style="top:8px;right:6px"></div>'; el.appendChild(cap); game.appendChild(el); return el; }; let topEl=mk(true),botEl=mk(false); pipes.push({el:topEl,x:W,scored:false,top:true,h:topHeight}); pipes.push({el:botEl,x:W,scored:false,top:false,h:topHeight,gap:gap}); }
function update(now){ if(!playing) return; let dt=Math.min(33,now-lastTime); lastTime=now; let step=dt/16.7; velocity+=gravity*step; birdY+=velocity*step; bird.style.top=birdY+'px'; if(birdY>groundTop()-10||birdY<0){ gameOver(); return; } pipeSpawn+=dt; let interval=Math.max(1900,Math.min(2600,getW()*5.5)); if(pipeSpawn>interval){ pipeSpawn=0; createPipe(); } let bx=birdX(); let speed=3*step; for(let p of pipes){ p.x-=speed; p.el.style.transform='translateX('+p.x+'px)'; if(!p.scored&&p.x<bx){ if(p.top){ score++; scoreEl.textContent=score; if(score>best){best=score; localStorage.setItem('pipedBirdsBest',best); bestEl.textContent='BEST: '+best;} } p.scored=true; } let bl=bx,br=bx+42,bt=birdY,bb=birdY+34,pl=p.x,pr=p.x+62; if(br>pl&&bl<pr){ if(p.top){ if(bt<p.h) {gameOver(); return;} } else { if(bb>p.h+p.gap){gameOver(); return;} } } } pipes=pipes.filter(p=>{ if(p.x<-80){p.el.remove(); return false} return true }); rafId=requestAnimationFrame(update); }
function gameOver(){ if(!playing) return; playing=false; cancelAnimationFrame(rafId); bird.style.transform='rotate(80deg)'; startEl.innerHTML='GAME OVER<br>Score: '+score+'<br>Best: '+best+'<br><br>PIPED BIRDS<br><small>By Kayden</small><br>TAP TO PLAY AGAIN'; startEl.style.display='block'; }
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault(); flap();}});
function instantFlap(e){ if(e) e.preventDefault(); flap(); }
game.addEventListener('pointerdown',instantFlap,{passive:false});
game.addEventListener('touchstart',instantFlap,{passive:false});
game.addEventListener('click',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{e.preventDefault()},{passive:false});
document.addEventListener('dblclick',e=>{e.preventDefault()});
</script>
</body>
</html>
